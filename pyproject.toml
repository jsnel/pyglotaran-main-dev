[project]
name = "pyglotaran-main-dev"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyglotaran-extras[dev]",
    # pyglotaran dependencies (from setup.cfg, since it uses legacy packaging)
    "asteval>=0.9.22,!=0.9.28",
    "attrs>=22.1.0",
    "click>=8.1.3",
    "netCDF4>=1.5.7",
    "numba>=0.55.0",
    "numpy>=1.21.2,<2.4",
    "odfpy>=1.4.1",
    "openpyxl>=3.0.10",
    "pandas>=1.3.4",
    "pydantic>=2.7.2",
    "ruamel.yaml>=0.17.17",
    "scipy>=1.7.2",
    "sdtfile>=2020.8.3",
    "tabulate>=0.8.9",
    "xarray>=2022.3.0",
]

[tool.uv.workspace]
members = [
    "pyglotaran-extras",
]

[tool.uv.sources]
pyglotaran-extras = { workspace = true }
# Install pyglotaran from local path (editable)
pyglotaran = { path = "pyglotaran", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=6.23.1",
    "jupyterlab>=4.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
